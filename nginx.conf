server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Frontend (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy → Controller Service (inkl. Player-Routen)
    location /api/controller/ {
        proxy_pass http://controller:8081/api/controller/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE (Server-Sent Events) braucht ungepufferte Verbindungen
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    location /api/player/ {
        proxy_pass http://controller:8081/api/player/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy → Model Service
    location /api/model/ {
        proxy_pass http://model:8082/api/model/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
