server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Frontend (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy → Controller Service (inkl. Player-Routen)
    location /api/controller/ {
        proxy_pass http://controller:8081/api/controller/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE (Server-Sent Events) braucht ungepufferte Verbindungen
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    location /api/player/ {
        proxy_pass http://controller:8081/api/player/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy → Performance-Benchmark Endpunkte
    location /api/perf/ {
        proxy_pass http://controller:8081/api/perf/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # Proxy → Model Service
    location /api/model/ {
        proxy_pass http://model:8082/api/model/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy → Lichess Bot Service (SSE)
    location /api/lichess/ {
        proxy_pass http://lichess:8085/api/lichess/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    # Proxy to Controller (Auth passthrough + all tournament routes)
    location /api/auth/ {
        proxy_pass http://controller:8081/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Status + Logs kommen vom Controller (RandomBot-Proxy), nicht vom tournament-server
    location = /api/tournament/status {
        proxy_pass http://controller:8081/api/tournament/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/tournament/logs {
        proxy_pass http://controller:8081/api/tournament/logs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    # Proxy to Controller (proxies all tournament/* to external server)
    location /api/tournament/ {
        proxy_pass http://controller:8081/api/tournament/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }
}
